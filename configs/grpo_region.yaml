model: models/Qwen2.5-VL-3B-Instruct
adapter: outputs/group_a_region_sft
data: data/outputs/train_grpo_region.jsonl
output: outputs/group_a_region_sft_grpo

# Region-only GRPO: 2K prompts x 4 rollouts, one epoch.
learning_rate: 1.0e-6
seed: 42
use_vllm: true
# A10 24GB: 0.35 leaves no usable KV cache after weights and profiling.
vllm_gpu_memory_utilization: 0.40
max_model_len: 4096
