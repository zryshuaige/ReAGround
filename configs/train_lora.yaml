# LoRA SFT config — matches the ZonUI-3B recipe (rank 8, alpha 16, bs 1 x accum 48,
# lr 2e-4) so that the only moving part across experiment groups is the data format.
model: models/Qwen2.5-VL-3B-Instruct
data: data/outputs/train_twostage.jsonl   # group A uses train_direct.jsonl
output: outputs/reaground_lora

lora:
  r: 8
  alpha: 16
  dropout: 0.05

lr: 2.0e-4
epochs: 1
batch_size: 1
grad_accum: 48
num_workers: 2
seed: 42

# Section weights: L = think*L_think + region*L_region + point*L_point (+ format, fixed 1).
# Default (0,1,1): supervise only verifiable facts; ablate region to 0.5/0.3 later.
lambdas:
  think: 0.0
  region: 1.0
  point: 1.0
